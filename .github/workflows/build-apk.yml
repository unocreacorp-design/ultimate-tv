name: Compilar app Android TV

on:
  push:
    branches: [main]
    paths: ["android.tar.gz", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Extraer el proyecto
        run: mkdir build-src && tar -xzf android.tar.gz -C build-src
      - name: Compilar el APK
        run: gradle -p build-src assembleRelease --no-daemon
      - name: Guardar app.apk en el repositorio
        run: |
          cp build-src/app/build/outputs/apk/release/app-release.apk app.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add app.apk
          git commit -m "Compilar app.apk" || exit 0
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: ultimate-tv-apk
          path: app.apk
