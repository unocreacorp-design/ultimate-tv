name: Revisar canales

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["check-streams.mjs", ".github/workflows/check-streams.yml"]

permissions:
  contents: write

concurrency:
  group: revisar-canales
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Revisar todos los canales
        run: node check-streams.mjs
      - name: Guardar status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Revisión de canales" || exit 0
          git pull --rebase origin main
          git push
